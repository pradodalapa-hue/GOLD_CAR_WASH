<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRENSA JDP INDUSTRIAL</title>
 <!-- TAGS CRÍTICAS PARA O WHATSAPP MOSTRAR A FOTO -->
    <meta property="og:title" content="Seu veículo está pronto!">
    <meta property="og:description" content="Confira nosso app venha conferir promoçoes e descontos!!.">
    <meta property="og:image" content="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1790434942988_image_6a630504.jpg">
    <meta property="og:type" content="website">
   
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0b1614; --card: #14211e; --accent: #20b396; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #2a3a37; }
        h1 { color: #D4AF37; font-size: 1.2rem; text-align: center; margin-bottom: 20px; }
        
        .valor-input { width: 100%; padding: 15px; background: #0a1412; border: 1px solid var(--accent); color: white; border-radius: 8px; box-sizing: border-box; font-size: 1.2rem; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        button { background: #1a2e2a; border: 1px solid #334a45; color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-principal { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        #pagamento-area { display: none; margin-top: 25px; border-top: 1px solid #2a3a37; padding-top: 20px; }
        
        .pix-flex { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 15px; }
        #qr-box { background: white; padding: 5px; width: 100px; height: 100px; border-radius: 8px; flex-shrink: 0; }
        #qr-box img { width: 100%; height: 100%; }
        .instrucoes { font-size: 0.75rem; color: #a0a0a0; line-height: 1.3; }
        
        .pix-code { background: #0a1412; padding: 10px; border: 1px solid #2a3a37; font-size: 0.65rem; color: #888; word-break: break-all; margin: 10px 0; border-radius: 5px; }
        .timer { color: var(--accent); font-size: 0.9rem; text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ GOLD CAR WASH</h1>
    <input type="number" id="valorManual" class="valor-input" placeholder="R$ 0,00">
    
    <div class="grid">
        <button onclick="setValor(20)">R$ 20</button>
        <button onclick="setValor(50)">R$ 50</button>
        <button onclick="setValor(100)">R$ 100</button>
    </div>
    
    <button class="btn-principal" onclick="gerarPix()">DEPOSITAR COM PIX</button>

    <div id="pagamento-area">
        <h3 style="text-align: center; color: var(--accent); margin-top: 0;">Finalize seu pagamento</h3>
        
        <div class="pix-flex">
            <div id="qr-box"></div>
            <div class="instrucoes">
                <strong>Escaneie o QR Code</strong><br>
                com o app do seu banco ou <strong>copie o código Pix</strong>.<br><br>
                1. Abra o app<br>2. Escaneie<br>3. Confirme
            </div>
        </div>
        
        <div id="pix-texto" class="pix-code"></div>
        <button id="btnCopiar" class="btn-principal" onclick="copiarPix()"> COPIAR CÓDIGO PIX</button>
        <div class="timer" id="timer">Tempo restante: 05:00</div>
    </div>
</div>

<script>
    const CHAVE = "6a0cad4f-34f5-44c0-b1d6-2de0c43ca9d8";
    const NOME = "PAULO HENRIQUE ALMEIRA PINHO";
    const CIDADE = "MANAUS";

    function setValor(v) { document.getElementById('valorManual').value = v; }

    function gerarPayload(valor) {
        const f = (id, v) => id + v.length.toString().padStart(2, '0') + v;
        const vStr = valor.toFixed(2);
        let p = "000201" + f("26", f("00", "br.gov.bcb.pix") + f("01", CHAVE)) + "520400005303986" + f("54", vStr) + "5802BR" + f("59", NOME.substring(0,25)) + f("60", CIDADE.substring(0,15)) + "62070503***6304";
        let crc = 0xFFFF;
        for (let i = 0; i < p.length; i++) {
            crc ^= (p.charCodeAt(i) << 8);
            for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : (crc << 1);
        }
        return p + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    function iniciarTimer(duracaoEmSegundos) {
        let timer = duracaoEmSegundos;
        const display = document.getElementById('timer');
        if(window.timerInterval) clearInterval(window.timerInterval);
        window.timerInterval = setInterval(() => {
            let minutos = parseInt(timer / 60, 10);
            let segundos = parseInt(timer % 60, 10);
            minutos = minutos < 10 ? "0" + minutos : minutos;
            segundos = segundos < 10 ? "0" + segundos : segundos;
            display.innerText = "Tempo restante: " + minutos + ":" + segundos;
            if (--timer < 0) {
                clearInterval(window.timerInterval);
                display.innerText = "Código expirado!";
            }
        }, 1000);
    }

    function gerarPix() {
        const v = parseFloat(document.getElementById('valorManual').value);
        if(!v || v <= 0) return;
        const pix = gerarPayload(v);
        document.getElementById('pagamento-area').style.display = 'block';
        document.getElementById('qr-box').innerHTML = "";
        new QRCode(document.getElementById('qr-box'), { text: pix, width: 100, height: 100 });
        document.getElementById('pix-texto').innerText = pix;
        iniciarTimer(300); 
    }

    function copiarPix() {
        const t = document.getElementById('pix-texto');
        const range = document.createRange();
        range.selectNode(t);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        document.execCommand('copy');
        window.getSelection().removeAllRanges();

        const btn = document.getElementById('btnCopiar');
        btn.innerText = " COPIADO!";
        btn.style.background = "#ffffff";
        btn.style.color = "#000";
        setTimeout(() => {
            btn.innerText = " COPIAR CÓDIGO PIX";
            btn.style.background = "#20b396";
            btn.style.color = "#000";
        }, 2000);
    }
</script>
</body>
</html>
