<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLD CAR WASH - PAGAMENTO</title>
    
    <!-- TAGS CRÍTICAS PARA O WHATSAPP MOSTRAR A FOTO -->
    <meta property="og:title" content="PAGUE COM O PIX !">
    <meta property="og:description" content="Pague com o Pix rápido e seguro.">
    <meta property="og:image" content="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1790472078751_1001572650.jpg">
    <meta property="og:type" content="website">

    <!-- FIREBASE E QRCODE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- TELA DE SEGURANÇA SLIDER -->
    <script>
    (function() {
        const FOTO_BLOQUEIO = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1790458867299_Screenshot_20260926_173717_Chrome_Beta.jpg";
        let tentativas = 0;
        const maxTentativas = 3;

        function criarTelaSeguranca() {
            if (document.getElementById('jdp-seguranca-overlay')) return;

            const overlay = document.createElement('div');
            overlay.id = 'jdp-seguranca-overlay';
            overlay.style.cssText = `
                position: fixed; inset: 0; z-index: 999999;
                background: #020617; display: flex; flex-direction: column;
                align-items: center; justify-content: center; font-family: 'Inter', sans-serif;
                color: #fff; user-select: none; padding: 20px;
            `;

            overlay.innerHTML = `
                <div style="background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 25px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.8);">
                    <h3 style="color: #fde047; font-size: 15px; font-weight: 900; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Área Restrita</h3>
                    <p style="color: #94a3b8; font-size: 11px; margin-bottom: 25px;">Arraste a alavanca totalmente para o lado para confirmar acesso humano.</p>
                    
                    <div id="jdp-slider-track" style="position: relative; width: 100%; height: 50px; background: #020617; border-radius: 25px; border: 1px solid #1e293b; overflow: hidden; display: flex; align-items: center;">
                        <span id="jdp-slider-text" style="position: absolute; width: 100%; text-align: center; font-size: 10px; font-weight: 800; color: #64748b; letter-spacing: 1px; pointer-events: none; text-transform: uppercase;">Puxe para liberar ➔</span>
                        <div id="jdp-slider-btn" style="position: absolute; left: 0; width: 50px; height: 50px; background: #fde047; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; font-size: 18px; box-shadow: 0 0 10px rgba(253,224,71,0.5);"></div>
                    </div>
                    <p id="jdp-tentativas-txt" style="color: #ef4444; font-size: 10px; margin-top: 15px; font-weight: bold; min-height: 14px;"></p>
                </div>
            `;

            document.documentElement.appendChild(overlay);

            const btn = document.getElementById('jdp-slider-btn');
            const track = document.getElementById('jdp-slider-track');
            const txtTentativas = document.getElementById('jdp-tentativas-txt');
            let arrastando = false;

            function iniciarArrasto() { arrastando = true; }

            function moverArrasto(e) {
                if (!arrastando) return;
                const trackRect = track.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let deslocamento = clientX - trackRect.left - 25;

                const maxDeslocamento = track.clientWidth - 50;
                if (deslocamento < 0) deslocamento = 0;
                if (deslocamento > maxDeslocamento) deslocamento = maxDeslocamento;

                btn.style.left = deslocamento + 'px';

                if (deslocamento >= maxDeslocamento - 5) {
                    arrastando = false;
                    sucessoAcesso();
                }
            }

            function pararArrasto() {
                if (!arrastando) return;
                arrastando = false;
                
                const trackRect = track.getBoundingClientRect();
                const btnRect = btn.getBoundingClientRect();
                const maxDeslocamento = track.clientWidth - 50;

                if ((btnRect.left - trackRect.left) < (maxDeslocamento - 15)) {
                    btn.style.left = '0px';
                    tentativas++;
                    
                    if (tentativas >= maxTentativas) {
                        bloqueioTotalDefinitivo();
                    } else {
                        txtTentativas.innerText = `Tentativa incorreta (${tentativas}/${maxTentativas}). Tente novamente.`;
                    }
                }
            }

            btn.addEventListener('mousedown', iniciarArrasto);
            window.addEventListener('mousemove', moverArrasto);
            window.addEventListener('mouseup', pararArrasto);

            btn.addEventListener('touchstart', iniciarArrasto);
            window.addEventListener('touchmove', moverArrasto);
            window.addEventListener('touchend', pararArrasto);
        }

        function sucessoAcesso() {
            const overlay = document.getElementById('jdp-seguranca-overlay');
            if (overlay) overlay.remove();
        }

        function bloqueioTotalDefinitivo() {
            document.body.innerHTML = `
                <div style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; margin: 0; padding: 0; overflow: hidden; position: fixed; inset: 0; z-index: 9999999;">
                    <img src="${FOTO_BLOQUEIO}" style="width: 100vw; height: 100vh; object-fit: cover; margin: 0; padding: 0; display: block;" alt="Bloqueio">
                </div>
            `;
            window.stop();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', criarTelaSeguranca);
        } else {
            criarTelaSeguranca();
        }
    })();
    </script>

    <style>
        :root { 
            --bg: #0b1614; 
            --card: #14211e; 
            --accent: #20b396; 
            --text: #ffffff; 
            --gold: #D4AF37;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #2a3a37; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: var(--gold); font-size: 1.2rem; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .valor-input { width: 100%; padding: 15px; background: #0a1412; border: 1px solid var(--accent); color: white; border-radius: 8px; box-sizing: border-box; font-size: 1.2rem; margin-bottom: 15px; text-align: center; font-weight: bold; }
        .valor-input::placeholder { color: #666; }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        button { background: #1a2e2a; border: 1px solid #334a45; color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:active { transform: scale(0.97); }
        
        .btn-principal { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.95rem; box-shadow: 0 0 15px rgba(32,179,150,0.3); }
        .btn-principal:active { transform: scale(0.98); }
        
        #pagamento-area { display: none; margin-top: 25px; border-top: 1px solid #2a3a37; padding-top: 20px; }
        
        .pix-flex { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 15px; }
        
        #qr-box { 
            background: #ffffff; 
            padding: 6px; 
            width: 105px; 
            height: 105px; 
            border-radius: 8px; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid #ffffff;
        }
        #qr-box img, #qr-box canvas { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: contain; 
        }

        .instrucoes { font-size: 0.75rem; color: #a0a0a0; line-height: 1.3; }
        
        .pix-code { background: #0a1412; padding: 10px; border: 1px solid #2a3a37; font-size: 0.65rem; color: #888; word-break: break-all; margin: 10px 0; border-radius: 5px; max-height: 70px; overflow-y: auto; }
        .timer { color: var(--accent); font-size: 0.9rem; text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ GOLD CAR WASH</h1>
    <input type="number" id="valorManual" class="valor-input" placeholder="R$ 0,00" step="0.01">
    
    <div class="grid">
        <button onclick="setValor(20)">R$ 20</button>
        <button onclick="setValor(50)">R$ 50</button>
        <button onclick="setValor(100)">R$ 100</button>
    </div>
    
    <button class="btn-principal" onclick="gerarPixManual()">DEPOSITAR COM PIX</button>

    <div id="pagamento-area">
        <h3 style="text-align: center; color: var(--accent); margin-top: 0; font-size: 1rem;">Finalize seu pagamento</h3>
        
        <div class="pix-flex">
            <div id="qr-box"></div>
            <div class="instrucoes">
                <strong>Escaneie o QR Code</strong><br>
                com o app do seu banco ou <strong>copie o código Pix</strong>.<br><br>
                1. Abra o app<br>2. Escaneie<br>3. Confirme
            </div>
        </div>
        
        <div id="pix-texto" class="pix-code"></div>
        <button id="btnCopiar" class="btn-principal" onclick="copiarPix()" style="margin-bottom: 10px;">COPIAR CÓDIGO PIX</button>
        <button class="btn-principal" onclick="confirmarPagamento()" style="background: #10b981; color: #000; box-shadow: 0 0 15px rgba(16,185,129,0.4);">JÁ REALIZEI O PAGAMENTO</button>
        <div class="timer" id="timer">Tempo restante: 03:00</div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "", databaseURL: "https://dony-burguers-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const CHAVE = "6a0cad4f-34f5-44c0-b1d6-2de0c43ca9d8";
    const NOME = "PAULO HENRIQUE ALMEIRA PINHO";
    const CIDADE = "MANAUS";

    let qrGerado = false;
    let atualizacaoExterna = false;

    // Recupera ou cria um ID único para esta cobrança/cliente com base na URL (?id=...)
    const urlParams = new URLSearchParams(window.location.search);
    let cobrancaId = urlParams.get('id');

    if (!cobrancaId) {
        // Se abrir sem ID, cria um ID exclusivo no Firebase e atualiza a URL sem recarregar a página
        cobrancaId = db.ref('cobrancas').push().key;
        const novaUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?id=' + cobrancaId;
        window.history.replaceState({path: novaUrl}, '', novaUrl);
    }

    const referenciaBanco = db.ref('cobrancas/' + cobrancaId);

    function setValor(v) { 
        document.getElementById('valorManual').value = v; 
        gerarPixManual();
    }

    function sanitizarValor(entrada) {
        if (typeof entrada === 'number') return isNaN(entrada) ? 0 : entrada;
        if (!entrada) return 0;
        let limpo = String(entrada).replace(/[^\d,\.]/g, '').replace(',', '.');
        let num = parseFloat(limpo);
        return isNaN(num) ? 0 : num;
    }

    function gerarPayload(valor) {
        const f = (id, v) => id + v.length.toString().padStart(2, '0') + v;
        const vStr = valor.toFixed(2);
        let p = "000201" + f("26", f("00", "br.gov.bcb.pix") + f("01", CHAVE)) + "520400005303986" + f("54", vStr) + "5802BR" + f("59", NOME.substring(0,25)) + f("60", CIDADE.substring(0,15)) + "62070503***6304";
        let crc = 0xFFFF;
        for (let i = 0; i < p.length; i++) {
            crc ^= (p.charCodeAt(i) << 8);
            for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : (crc << 1);
        }
        return p + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }

    function iniciarTimer(duracaoEmSegundos) {
        let timer = duracaoEmSegundos;
        const display = document.getElementById('timer');
        if(window.timerInterval) clearInterval(window.timerInterval);
        window.timerInterval = setInterval(() => {
            let minutos = parseInt(timer / 60, 10);
            let segundos = parseInt(timer % 60, 10);
            minutos = minutos < 10 ? "0" + minutos : minutos;
            segundos = segundos < 10 ? "0" + segundos : segundos;
            display.innerText = "Tempo restante: " + minutos + ":" + segundos;
            if (--timer < 0) {
                clearInterval(window.timerInterval);
                display.innerText = "Código expirado!";
                referenciaBanco.update({ status: "EXPIRADO" });
                window.location.href = "https://www.google.com";
            }
        }, 1000);
    }

    function processarPix(valor) {
        if (!valor || valor <= 0) return;
        qrGerado = true;
        const pix = gerarPayload(valor);
        document.getElementById('pagamento-area').style.display = 'block';
        document.getElementById('qr-box').innerHTML = "";
        
        new QRCode(document.getElementById('qr-box'), { 
            text: pix, 
            width: 95, 
            height: 95,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        document.getElementById('pix-texto').innerText = pix;
        iniciarTimer(180); // 3 minutos exatos
    }

    function gerarPixManual() {
        const val = sanitizarValor(document.getElementById('valorManual').value);
        if (val <= 0) {
            alert("Digite um valor válido.");
            return;
        }
        
        atualizacaoExterna = true;
        referenciaBanco.set({
            status: "AGUARDANDO",
            valor_aguardando: val
        }).then(() => {
            setTimeout(() => { atualizacaoExterna = false; }, 500);
        });

        processarPix(val);
    }

    // Ouve em tempo real apenas o ID exclusivo desta sessão/cliente
    referenciaBanco.on('value', snap => {
        if (atualizacaoExterna) return;

        const info = snap.val();
        if (info && info.status === "AGUARDANDO" && info.valor_aguardando !== undefined) {
            const valorSeguro = sanitizarValor(info.valor_aguardando);
            if (valorSeguro > 0) {
                document.getElementById('valorManual').value = valorSeguro;
                processarPix(valorSeguro);
            }
        } else if (info && info.status === "RECEBIDO") {
            qrGerado = true;
            document.getElementById('pagamento-area').innerHTML = `
                <div style="background: #10b981; color: #000; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold;">
                    <i class="fas fa-check-circle"></i> PAGAMENTO APROVADO COM SUCESSO!<br>
                    <span style="font-size: 11px;">Fechando página...</span>
                </div>
            `;
            setTimeout(() => { window.close(); }, 2000);
        } else if (info && info.status === "EXPIRADO") {
            document.getElementById('timer').innerText = "Código expirado!";
            window.location.href = "https://www.google.com";
        }
    }, (error) => {
        console.error("Erro ao escutar o Firebase:", error);
    });

    function confirmarPagamento() {
        referenciaBanco.update({ status: "RECEBIDO" });
    }

    function copiarPix() {
        const textoPix = document.getElementById('pix-texto').innerText;
        const tempInput = document.createElement('textarea');
        tempInput.value = textoPix;
        document.body.appendChild(tempInput);
        tempInput.select();
        tempInput.setSelectionRange(0, 99999);

        try {
            const sucesso = document.execCommand('copy');
            document.body.removeChild(tempInput);
            
            if (sucesso) {
                const btn = document.getElementById('btnCopiar');
                btn.innerText = "COPIADO COM SUCESSO!";
                btn.style.background = "#ffffff";
                btn.style.color = "#000";
                setTimeout(() => {
                    btn.innerText = "COPIAR CÓDIGO PIX";
                    btn.style.background = "var(--accent)";
                    btn.style.color = "#000";
                }, 2000);
            } else {
                alert("Erro ao copiar. Selecione o código manualmente.");
            }
        } catch (err) {
            document.body.removeChild(tempInput);
            alert("Erro ao copiar. Selecione o código manualmente.");
        }
    }
</script>
</body>
</html>
