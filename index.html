<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLD CAR WASH - PAGAMENTO JDP</title>
    
    <!-- TAGS CRÍTICAS PARA O WHATSAPP MOSTRAR A FOTO -->
    <meta property="og:title" content="PAGUE COM O PIX !">
    <meta property="og:description" content="Pague com o Pix rápido e seguro.">
    <meta property="og:image" content="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1790472078751_1001572650.jpg">
    <meta property="og:type" content="website">

    <!-- FIREBASE, QRCODE E HTML2CANVAS -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- TELA DE SEGURANÇA SLIDER -->
    <script>
    (function() {
        const FOTO_BLOQUEIO = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1790458867299_Screenshot_20260926_173717_Chrome_Beta.jpg";
        let tentativas = 0;
        const maxTentativas = 3;

        function criarTelaSeguranca() {
            if (document.getElementById('jdp-seguranca-overlay')) return;

            const overlay = document.createElement('div');
            overlay.id = 'jdp-seguranca-overlay';
            overlay.style.cssText = `
                position: fixed; inset: 0; z-index: 999999;
                background: #020617; display: flex; flex-direction: column;
                align-items: center; justify-content: center; font-family: 'Inter', sans-serif;
                color: #fff; user-select: none; padding: 20px;
            `;

            overlay.innerHTML = `
                <div style="background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 25px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.8);">
                    <h3 style="color: #fde047; font-size: 15px; font-weight: 900; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Área Restrita - Vigia JDP</h3>
                    <p style="color: #94a3b8; font-size: 11px; margin-bottom: 25px;">Arraste a alavanca totalmente para o lado para confirmar acesso.</p>
                    
                    <div id="jdp-slider-track" style="position: relative; width: 100%; height: 50px; background: #020617; border-radius: 25px; border: 1px solid #1e293b; overflow: hidden; display: flex; align-items: center;">
                        <span id="jdp-slider-text" style="position: absolute; width: 100%; text-align: center; font-size: 10px; font-weight: 800; color: #64748b; letter-spacing: 1px; pointer-events: none; text-transform: uppercase;">Puxe para liberar ➔</span>
                        <div id="jdp-slider-btn" style="position: absolute; left: 0; width: 50px; height: 50px; background: #fde047; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 900; font-size: 18px; box-shadow: 0 0 10px rgba(253,224,71,0.5);"></div>
                    </div>
                    <p id="jdp-tentativas-txt" style="color: #ef4444; font-size: 10px; margin-top: 15px; font-weight: bold; min-height: 14px;"></p>
                </div>
            `;

            document.documentElement.appendChild(overlay);

            const btn = document.getElementById('jdp-slider-btn');
            const track = document.getElementById('jdp-slider-track');
            const txtTentativas = document.getElementById('jdp-tentativas-txt');
            let arrastando = false;

            function iniciarArrasto() { arrastando = true; }

            function moverArrasto(e) {
                if (!arrastando) return;
                const trackRect = track.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let deslocamento = clientX - trackRect.left - 25;

                const maxDeslocamento = track.clientWidth - 50;
                if (deslocamento < 0) deslocamento = 0;
                if (deslocamento > maxDeslocamento) deslocamento = maxDeslocamento;

                btn.style.left = deslocamento + 'px';

                if (deslocamento >= maxDeslocamento - 5) {
                    arrastando = false;
                    sucessoAcesso();
                }
            }

            function pararArrasto() {
                if (!arrastando) return;
                arrastando = false;
                
                const trackRect = track.getBoundingClientRect();
                const btnRect = btn.getBoundingClientRect();
                const maxDeslocamento = track.clientWidth - 50;

                if ((btnRect.left - trackRect.left) < (maxDeslocamento - 15)) {
                    btn.style.left = '0px';
                    tentativas++;
                    
                    if (tentativas >= maxTentativas) {
                        bloqueioTotalDefinitivo();
                    } else {
                        txtTentativas.innerText = `Tentativa incorreta (${tentativas}/${maxTentativas}). Tente novamente.`;
                    }
                }
            }

            btn.addEventListener('mousedown', iniciarArrasto);
            window.addEventListener('mousemove', moverArrasto);
            window.addEventListener('mouseup', pararArrasto);

            btn.addEventListener('touchstart', iniciarArrasto);
            window.addEventListener('touchmove', moverArrasto);
            window.addEventListener('touchend', pararArrasto);
        }

        function sucessoAcesso() {
            const overlay = document.getElementById('jdp-seguranca-overlay');
            if (overlay) overlay.remove();
        }

        function bloqueioTotalDefinitivo() {
            document.body.innerHTML = `
                <div style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; margin: 0; padding: 0; overflow: hidden; position: fixed; inset: 0; z-index: 9999999;">
                    <img src="${FOTO_BLOQUEIO}" style="width: 100vw; height: 100vh; object-fit: cover; margin: 0; padding: 0; display: block;" alt="Bloqueio">
                </div>
            `;
            window.stop();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', criarTelaSeguranca);
        } else {
            criarTelaSeguranca();
        }
    })();
    </script>

    <style>
        :root { 
            --bg: #0b1614; 
            --card: #14211e; 
            --accent: #20b396; 
            --text: #ffffff; 
            --gold: #D4AF37;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 400px; background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #2a3a37; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        
        .status-badge-topo {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1e293b;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-badge-topo.pago {
            background: #10b981;
            color: #000;
            border-color: #10b981;
        }

        h1 { color: var(--gold); font-size: 1.2rem; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; padding-right: 60px; }
        
        .valor-input { width: 100%; padding: 15px; background: #0a1412; border: 1px solid var(--accent); color: white; border-radius: 8px; box-sizing: border-box; font-size: 1.2rem; margin-bottom: 15px; text-align: center; font-weight: bold; }
        
        #pagamento-area { display: block; margin-top: 25px; border-top: 1px solid #2a3a37; padding-top: 20px; }
        
        .pix-flex { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 15px; }
        
        #qr-box { 
            background: #ffffff; 
            padding: 6px; 
            width: 105px; 
            height: 105px; 
            border-radius: 8px; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid #ffffff;
        }
        #qr-box img, #qr-box canvas { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: contain; 
        }

        .instrucoes { font-size: 0.75rem; color: #a0a0a0; line-height: 1.3; }
        .pix-code { background: #0a1412; padding: 10px; border: 1px solid #2a3a37; font-size: 0.65rem; color: #888; word-break: break-all; margin: 10px 0; border-radius: 5px; max-height: 70px; overflow-y: auto; }
        .timer { color: var(--accent); font-size: 0.9rem; text-align: center; margin-top: 10px; font-weight: bold; }
        
        .status-aguardando {
            background: #1e293b;
            border: 1px dashed var(--gold);
            color: var(--gold);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="badgeStatusTopo" class="status-badge-topo">Aguardando</div>
    <h1>🛡️ GOLD CAR WASH</h1>
    <input type="text" id="valorManual" class="valor-input" placeholder="R$ 0,00" disabled>

    <div id="pagamento-area">
        <h3 style="text-align: center; color: var(--accent); margin-top: 0; font-size: 1rem;">Finalize seu pagamento</h3>
        
        <div class="pix-flex">
            <div id="qr-box"></div>
            <div class="instrucoes">
                <strong>Escaneie o QR Code</strong><br>
                com o app do seu banco ou <strong>copie o código Pix</strong>.<br><br>
                1. Abra o app<br>2. Escaneie<br>3. Confirme
            </div>
        </div>
        
        <div id="pix-texto" class="pix-code"></div>
        <button id="btnCopiar" class="btn-principal" onclick="copiarPix()" style="width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem;">COPIAR CÓDIGO PIX</button>
        
        <div class="status-aguardando">
            <i class="fas fa-shield-alt"></i> AGUARDANDO CONFIRMAÇÃO DO VIGIA JDP...
        </div>

        <div class="timer" id="timer">Tempo restante: 05:00</div>
    </div>
</div>

<script>
    const LOJA_ID = "NUBANK_01";
    const WHATSAPP_DESTINO = "92984846058";
    const CHAVE = "pradolindalva4@gmail.com";
    const NOME_EMISSOR = "JOSE LAPA";
    const CIDADE = "MANAUS";
    const VIDEO_COMEMORACAO = "https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/media/jdp_1786372933817_gemini_generated_video_6e940877.mp4";

    const fbConfig = { apiKey: "", databaseURL: "https://dony-burguers-default-rtdb.firebaseio.com" };
    if (!firebase.apps.length) firebase.initializeApp(fbConfig);
    const db = firebase.database();

    let valorCongelado = 0.17; // Valor padrão inicial seguro
    let chaveCongelada = CHAVE;
    let idUrlAtual = null;
    let comprovanteEnviadoZap = false;
    let pagamentoAprovadoExibido = false;
    const tempoInicioSessao = Date.now();

    function sanitizarValor(entrada) {
        if (typeof entrada === 'number') return isNaN(entrada) ? 0 : entrada;
        if (!entrada) return 0;
        let limpo = String(entrada).replace(/[^\d,\.]/g, '').replace(',', '.');
        let num = parseFloat(limpo);
        return isNaN(num) ? 0 : num;
    }

    function formatField(id, val) {
        const len = val.length.toString().padStart(2, '0');
        return id + len + val;
    }

    function gerarPayload(valor, chavePixCustom) {
        const chaveUsada = (chavePixCustom || CHAVE).trim();
        const vStr = valor.toFixed(2);
        
        const guiPix = formatField("00", "br.gov.bcb.pix") + formatField("01", chaveUsada);
        const merchantAccount = formatField("26", guiPix);
        
        const mcc = "52040000";
        const moeda = "5303986"; 
        const valorField = formatField("54", vStr);
        const pais = "5802BR";
        const nomeField = formatField("59", NOME_EMISSOR.substring(0, 25));
        const cidadeField = formatField("60", CIDADE.substring(0, 15));
        
        const additionalData = formatField("05", "***");
        const sub62 = formatField("62", additionalData);

        let payload = "000201" + merchantAccount + mcc + moeda + valorField + pais + nomeField + cidadeField + sub62 + "6304";

        let crc = 0xFFFF;
        for (let i = 0; i < payload.length; i++) {
            crc ^= (payload.charCodeAt(i) << 8);
            for (let j = 0; j < 8; j++) {
                crc = (crc & 0x8000) ? (crc << 1) ^ 0x1021 : (crc << 1);
                crc &= 0xFFFF;
            }
        }
        return payload + crc.toString(16).toUpperCase().padStart(4, '0');
    }

    function iniciarTimer(duracaoEmSegundos) {
        let timer = duracaoEmSegundos;
        const display = document.getElementById('timer');
        if(window.timerInterval) clearInterval(window.timerInterval);
        window.timerInterval = setInterval(() => {
            let minutos = parseInt(timer / 60, 10);
            let segundos = parseInt(timer % 60, 10);
            minutos = minutos < 10 ? "0" + minutos : minutos;
            segundos = segundos < 10 ? "0" + segundos : segundos;
            display.innerText = "Tempo restante: " + minutos + ":" + segundos;
            
            if (--timer < 0) {
                clearInterval(window.timerInterval);
                display.innerText = "Código expirado!";
            }
        }, 1000);
    }

    function configurarPix(valor, chavePersonalizada) {
        const vSan = sanitizarValor(valor);
        if (vSan > 0) valorCongelado = vSan;
        if (chavePersonalizada) chaveCongelada = chavePersonalizada;

        document.getElementById('valorManual').value = valorCongelado.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        
        const pix = gerarPayload(valorCongelado, chaveCongelada);
        document.getElementById('qr-box').innerHTML = "";
        
        new QRCode(document.getElementById('qr-box'), { 
            text: pix, 
            width: 95, 
            height: 95,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        document.getElementById('pix-texto').innerText = pix;
        if (!window.timerInterval) iniciarTimer(300);

        setTimeout(() => {
            html2canvas(document.getElementById('pagamento-area'), { 
                useCORS: true,
                allowTaint: true,
                scale: 1.0
            }).then(canvas => {
                const qrBase64 = canvas.toDataURL('image/jpeg', 0.75);
                db.ref('lojas/' + LOJA_ID + '/qr_venda_ativa').set(qrBase64).catch(err => {});
            });
        }, 1000);
    }

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        idUrlAtual = urlParams.get('id');
        const valUrl = urlParams.get('v') || urlParams.get('valor');

        // 1. Define o valor inicial pelo link se houver
        if (valUrl) {
            configurarPix(valUrl, CHAVE);
        } else {
            configurarPix(0.17, CHAVE); // Padrão inicial de segurança
        }

        // 2. Busca o valor exato no Firebase se tiver ID de cobrança na URL
        if (idUrlAtual) {
            db.ref('cobrancas/' + idUrlAtual).once('value').then(snap => {
                const info = snap.val();
                if (info && info.valor) {
                    configurarPix(info.valor, info.chavePix || info.chave || CHAVE);
                }
            });
        }

        // 3. OUVINTE DO HISTÓRICO: Só dispara o sucesso se for um pagamento novo criado APÓS abrir a página
        db.ref('lojas/' + LOJA_ID + '/historico_pagamentos').limitToLast(1).on('child_added', snapshot => {
            const dados = snapshot.val();
            if (!dados) return;

            const timestampPagamento = dados.timestamp || dados.data_hora_ms || 0;
            if (timestampPagamento > 0 && timestampPagamento < tempoInicioSessao) {
                return; // Ignora histórico antigo
            }

            const valorRecebido = parseFloat(dados.valor_recebido || dados.valor || 0);
            if (valorRecebido > 0 && !pagamentoAprovadoExibido) {
                valorCongelado = valorRecebido;
                mostrarPagamentoAprovado();
            }
        });

        // 4. OUVINTE DO CAIXA DIRETO (Disparado pelo Java/VigiaService)
        db.ref('lojas/' + LOJA_ID + '/caixa_pagamento').on('value', snap => {
            const info = snap.val();
            if (!info) return;

            const statusStr = String(info.status || "").trim().toUpperCase();
            const vVal = sanitizarValor(info.valor || info.valor_aguardando);

            if ((statusStr === "RECEBIDO" || statusStr === "PAGO" || statusStr === "APROVADO" || statusStr === "SUCCESS") && !pagamentoAprovadoExibido) {
                if (vVal > 0) valorCongelado = vVal;
                mostrarPagamentoAprovado();
            }
        });

        // 5. OUVINTE DA COBRANÇA NA URL (Caso o Java atualize o status da cobrança específica)
        if (idUrlAtual) {
            db.ref('cobrancas/' + idUrlAtual).on('value', snap => {
                const info = snap.val();
                if (!info) return;

                const statusStr = String(info.status || "").trim().toUpperCase();
                const vVal = sanitizarValor(info.valor || info.valor_aguardando);

                if (vVal > 0) configurarPix(vVal, info.chavePix || info.chave || CHAVE);

                if ((statusStr === "RECEBIDO" || statusStr === "PAGO" || statusStr === "APROVADO") && !pagamentoAprovadoExibido) {
                    valorCongelado = vVal > 0 ? vVal : valorCongelado;
                    mostrarPagamentoAprovado();
                }
            });
        }
    });

    function mostrarPagamentoAprovado() {
        if (pagamentoAprovadoExibido) return;
        pagamentoAprovadoExibido = true;

        if (window.timerInterval) clearInterval(window.timerInterval);
        tocarSom();
        
        const badge = document.getElementById('badgeStatusTopo');
        badge.innerText = "PAGO";
        badge.classList.add("pago");

        // Agora sim exibe a comemoração e o vídeo enviados pelo Java
        document.getElementById('pagamento-area').innerHTML = `
            <div style="position: relative; width: 100%; height: 220px; border-radius: 8px; overflow: hidden; margin-bottom: 15px; background: #000;">
                <video id="video-sucesso-pos" src="${VIDEO_COMEMORACAO}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;" autoplay loop muted playsinline></video>
                <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); padding: 15px; text-align: center;">
                    <i class="fas fa-check-circle" style="font-size: 2.5rem; color: #10b981; margin-bottom: 5px;"></i>
                    <div style="color: var(--gold); font-weight: 900; font-size: 1.2rem;">PAGAMENTO APROVADO!</div>
                    <div style="color: #fff; font-size: 1rem; font-weight: bold; margin-top: 5px;">${valorCongelado.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</div>
                </div>
            </div>
            
            <div id="comprovante-jdp" style="background: #0a1412; border: 1px solid var(--accent); padding: 15px; border-radius: 8px; font-size: 0.8rem; color: #fff; line-height: 1.5;">
                <div style="text-align: center; color: var(--gold); font-weight: bold; margin-bottom: 10px; font-size: 0.9rem;">COMPROVANTE DE PAGAMENTO JDP</div>
                <div><strong>Status:</strong> APROVADO ✅</div>
                <div><strong>Valor:</strong> ${valorCongelado.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</div>
                <div><strong>Data/Hora:</strong> ${new Date().toLocaleString('pt-BR')}</div>
                <div><strong>ID Transação:</strong> ${idUrlAtual || 'GOLD_CAR_WASH_' + Date.now()}</div>
                <div><strong>Estabelecimento:</strong> GOLD CAR WASH</div>
                <div><strong>Chave Pix:</strong> ${chaveCongelada}</div>
            </div>
            <button id="btnEnviarZap" onclick="enviarComprovanteZap()" style="width: 100%; margin-top: 15px; padding: 15px; background: #25d366; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem;">
                <i class="fab fa-whatsapp"></i> ENVIAR COMPROVANTE JDP (92984846058)
            </button>
        `;

        db.ref('lojas/' + LOJA_ID + '/qr_venda_ativa').set(VIDEO_COMEMORACAO).catch(err => {});
        db.ref('lojas/' + LOJA_ID + '/caixa_pagamento').set({ status: "STANDBY", valor_aguardando: "0" }).catch(err => {});
    }

    function enviarComprovanteZap() {
        if (comprovanteEnviadoZap) return;
        comprovanteEnviadoZap = true;

        const valorFormatado = valorCongelado.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        const dataHora = new Date().toLocaleString('pt-BR');
        const idTrans = idUrlAtual || 'GOLD_CAR_WASH_' + Date.now();

        const textoMensagem = `*COMPROVANTE DE PAGAMENTO JDP* 🛡\n\n` +
            `*Status:* APROVADO ✅\n` +
            `*Valor:* ${valorFormatado}\n` +
            `*Data/Hora:* ${dataHora}\n` +
            `*ID Transação:* ${idTrans}\n` +
            `*Estabelecimento:* GOLD CAR WASH\n` +
            `*Chave Pix:* ${chaveCongelada}\n\n` +
            `_Comprovante gerado automaticamente pelo Sistema JDP._`;

        const urlZap = `https://api.whatsapp.com/send?phone=55${WHATSAPP_DESTINO}&text=` + encodeURIComponent(textoMensagem);
        
        window.open(urlZap, '_blank');
        
        setTimeout(() => {
            window.location.href = "https://www.google.com";
        }, 800);
    }

    function copiarPix() {
        const textoPix = document.getElementById('pix-texto').innerText;
        const tempInput = document.createElement('textarea');
        tempInput.value = textoPix;
        document.body.appendChild(tempInput);
        tempInput.select();
        tempInput.setSelectionRange(0, 99999);

        try {
            const sucesso = document.execCommand('copy');
            document.body.removeChild(tempInput);
            
            if (sucesso) {
                const btn = document.getElementById('btnCopiar');
                btn.innerText = "COPIADO COM SUCESSO!";
                btn.style.background = "#ffffff";
                btn.style.color = "#000";
                setTimeout(() => {
                    btn.innerText = "COPIAR CÓDIGO PIX";
                    btn.style.background = "var(--accent)";
                    btn.style.color = "#000";
                }, 2000);
            }
        } catch (err) {
            document.body.removeChild(tempInput);
        }
    }

    function tocarSom() { 
        try { 
            const ctx = new (window.AudioContext || window.webkitAudioContext)(); 
            const osc = ctx.createOscillator(); 
            osc.connect(ctx.destination); 
            osc.start(); 
            osc.stop(ctx.currentTime + 0.2); 
        } catch(e) {} 
    }
</script>
</body>
</html>
