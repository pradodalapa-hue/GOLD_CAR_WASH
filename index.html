    <script id="cere-db" type="application/base64">e30=</script>
    <script>
        let ca=1;
        let layersDb = {};
        let cereDb = {};

        function inicializarProjetosIsolados() {
            try {
                const rawDb = document.getElementById('layers-db').textContent;
                layersDb = JSON.parse(decodeURIComponent(escape(atob(rawDb))));
                document.querySelectorAll('.universal-project-frame').forEach(iframe => {
                    const layerParent = iframe.closest('.layer');
                    if(layerParent){
                        const layerId = layerParent.id.replace('layer-1-', '');
                        const base64Html = layersDb['1-' + layerId];
                        if(base64Html) {
                            const rawHtml = decodeURIComponent(escape(atob(base64Html)));
                            const doc = iframe.contentWindow.document;
                            doc.open();
                            doc.write(rawHtml);
                            doc.close();
                        }
                    }
                });
            } catch(e) {
                console.error("Erro na injeção HELENA Core:", e);
            }
            try {
                const rawCere = document.getElementById('cere-db').textContent;
                if(rawCere && rawCere.trim() !== "") {
                    cereDb = JSON.parse(decodeURIComponent(escape(atob(rawCere))));
                }
            } catch(e) {
                console.error("Erro na leitura do Banco CERE:", e);
            }
        }

        function obterEscalaTransform(el) {
            const tr = window.getComputedStyle(el).transform;
            if (tr && tr !== 'none') {
                const values = tr.split('(')[1].split(')')[0].split(',');
                const a = parseFloat(values[0]);
                const b = parseFloat(values[1]);
                return Math.sqrt(a*a + b*b);
            }
            return 1;
        }

        function ajustarAlturaTela(layerId) {
            const layer = document.getElementById('layer-1-' + layerId);
            if (!layer) return;
            // Apenas mídias e textos influenciam a altura dinâmica da tela (hotspots e bg são ignorados)
            const imgs = layer.querySelectorAll('.fixed-img, .fixed-txt');
            let maxAltura = window.innerHeight || 740;
            const screenWidth = window.innerWidth;

            imgs.forEach(img => {
                if (img.classList.contains('bg-media')) return;
                let topVal = 0;
                const topStyle = img.style.top;
                
                // Conversor reverso dinâmico de VW para Pixels em tempo de execução
                if (topStyle && topStyle.includes('vw')) {
                    topVal = (parseFloat(topStyle) / 100) * screenWidth;
                } else {
                    topVal = parseFloat(topStyle) || 0;
                }
                
                const scaleCompensate = obterEscalaTransform(img);
                const heightVal = (img.offsetHeight || img.getBoundingClientRect().height || 100) * scaleCompensate;
                const baseDaFoto = topVal + heightVal;
                if (baseDaFoto > maxAltura) {
                    maxAltura = baseDaFoto;
                }
            });
            layer.style.minHeight = maxAltura + 100 + 'px';
        }

        function irPara(id){
            document.querySelectorAll('.layer').forEach(l=>{
                l.classList.remove('active');
                l.style.display = 'none';
            });
            const d=document.getElementById('layer-1-'+id);
            if(d){
                d.classList.add('active');
                d.style.display = 'block';
                ca=id;
                ajustarAlturaTela(id);
            }
            const dyn=document.getElementById('layer-dinamica-preview');
            if(dyn)dyn.remove();
        }

        function abrirTelaCereDinamica(htmlConteudo){
            let l=document.getElementById('layer-dinamica-preview');
            if(!l){
                l=document.createElement('div');
                l.id='layer-dinamica-preview';
                l.className='layer-dinamica';
                document.getElementById('sc').appendChild(l);
            }
            l.innerHTML = '<div style="position: absolute; top: 10px; right: 10px; z-index: 100000000;"><button onclick="fecharTelaCereDinamica()" style="background: rgba(0,0,0,0.85); color: #06b6d4; border: 2px solid #06b6d4; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; font-family: sans-serif;">✕ VOLTAR</button></div>';
            const iframe=document.createElement('iframe');
            iframe.style.cssText='width:100%;height:100%;border:none;background:#000';
            l.appendChild(iframe);
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(htmlConteudo);
            doc.close();
            document.querySelectorAll('.layer').forEach(x=>{
                x.classList.remove('active');
                x.style.display = 'none';
            });
            l.style.display='block';
        }

        function fecharTelaCereDinamica(){
            const l=document.getElementById('layer-dinamica-preview');
            if(l) l.remove();
            irPara(ca);
        }

        window.addEventListener('resize', () => ajustarAlturaTela(ca));
        window.addEventListener('DOMContentLoaded', () => {
            inicializarProjetosIsolados();
            irPara(1);
        });

        document.querySelectorAll('.hotspot').forEach(h=>{
            h.onclick=function(e){
                e.stopPropagation();
                if(this.dataset.target) irPara(this.dataset.target);
                else if(this.dataset.link) window.open(this.dataset.link,'_blank');
                else if(this.dataset.cereSerial){
                    const html = cereDb[this.dataset.cereSerial];
                    if(html) abrirTelaCereDinamica(html);
                }
            }
        });
    </script>
</body>
